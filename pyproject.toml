[project]
name = "delegate-task-advanced"
version = "1.1.1"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
